<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima sencillo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        max-width: 480px;
      }
      label,
      button {
        font-size: 1rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0 1rem;
        box-sizing: border-box;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        background: #f9f9f9;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Clima sencillo</h1>
    <form id="weather-form">
      <label for="city">Nombre de la ciudad</label>
      <input
        type="text"
        id="city"
        name="city"
        placeholder="Ej. Madrid"
        required
      />
      <button type="submit">Buscar clima</button>
    </form>

    <div id="result" class="card" hidden>
      <p><strong>Ciudad:</strong> <span id="city-name"></span></p>
      <p><strong>Temperatura:</strong> <span id="temperature"></span> °C</p>
      <p><strong>Viento:</strong> <span id="wind-speed"></span> km/h</p>
      <p>
        <strong>Dirección del viento:</strong>
        <span id="wind-direction"></span>°
      </p>
    </div>

    <p id="message"></p>

    <script src="src/js/weather.js"></script>
  </body>
</html>
