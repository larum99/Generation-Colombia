<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand">Mi Tienda</span>
                <span class="badge bg-danger" id="badge">0</span>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <section>

            <h2 id="productos-title">Productos</h2>

            <div class="row g-4">

                <article class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h3 class="card-title h5">Portátil</h3>
                            <p>$4.500.000</p>

                            <button class="btn btn-primary btn-agregar" data-nombre="Portátil" data-precio="4500000">
                                Agregar
                            </button>
                        </div>
                    </div>
                </article>

                <article class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h3 class="card-title h5">Celular</h3>
                            <p>$2.500.000</p>

                            <button class="btn btn-primary btn-agregar" data-nombre="Celular" data-precio="2500000">
                                Agregar
                            </button>
                        </div>
                    </div>
                </article>

                <article class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h3 class="card-title h5">Computador de escritorio</h3>
                            <p>$8.500.000</p>

                            <button class="btn btn-primary btn-agregar" data-nombre="Computador de escritorio" data-precio="8500000">
                                Agregar
                            </button>
                        </div>
                    </div>
                </article>

                <article class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h3 class="card-title h5">Tablet</h3>
                            <p>$3.500.000</p>

                            <button class="btn btn-primary btn-agregar" data-nombre="Tablet" data-precio="3500000">
                                Agregar
                            </button>
                        </div>
                    </div>
                </article>

            </div>

        </section>

        <section class="mt-5">

            <h2 id="carrito-title">
                Carrito de compras
            </h2>

            <ul id="lista-carrito" class="list-group mb-3">
                <li id="msg-vacio" class="list-group-item">
                    Tu carrito está vacío
                </li>
            </ul>

            <p class="fs-4">
                Total:
                <span id="total">$0.00</span>
            </p>

            <button id="btn-vaciar" class="btn btn-danger">
                Vaciar carrito
            </button>

        </section>

    </main>

    <footer class="text-center py-3">
        <small>Mini Tienda - Laboratorio DOM</small>
    </footer>

    <script src="script.js"></script>
</body>

</html>
