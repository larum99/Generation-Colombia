<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Card</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <main class="container d-flex justify-content-center align-items-center vh-100">

        <article class="card profile-card text-center">

            <header class="card-header-custom"></header>

            <section class="card-body">

                <img src="./img/" alt="Fotografía de Laura Barona Saavedra" class="profile-img">

                <h1 class="mt-3">
                    Laura Barona Saavedra
                </h1>

                <h2 class="role">
                    Backend Developer | Java Spring Boot
                </h2>

                <p class="description">
                    Desarrolladora de software con experiencia en backend y conocimientos en frontend.
                </p>

                <a href="mailto:laura.barona@uao.edu.co" class="btn btn-custom">
                    Contactarme
                </a>

                <nav class="social-icons mt-4" aria-label="Redes sociales">

                    <a href="https://github.com/larum99">
                        <i class="bi bi-github"></i>
                    </a>

                    <a href="https://www.linkedin.com/in/laura-barona-saavedra-backend-frontend-software-developer/">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </nav>

            </section>

        </article>

    </main>
</body>

</html>
